name: Deploy web to Cloudflare Workers

# Builds the Next.js app with the OpenNext Cloudflare adapter and deploys it
# (frontend + /api route handlers) to Cloudflare Workers.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
#
# Runtime secrets for the Worker (set ONCE in the Cloudflare dashboard, or with
# `wrangler secret put`, so the /api handlers can reach Supabase):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY

# WHEN THIS RUNS: on a push to main — i.e. when a branch is merged — and on a
# manual dispatch, nothing else. It used to fire on every push to the feature
# branches listed here, which meant a deploy (and the browser suite behind it)
# for every single commit of a work-in-progress branch. Iterating on a branch is
# not a release.
#
# The trade: the shared site now tracks main rather than the branch in flight,
# so a change cannot be looked at on the live URL before it is merged. Deploy a
# branch on purpose with `workflow_dispatch` when that is what you want.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build -w @tog/shared

      - name: Run unit tests
        run: npm test

      # Stamp the commit into the bundle so the post-deploy suite can tell this
      # version apart from the one Cloudflare is still serving (rollout takes a
      # few seconds). NEXT_PUBLIC_* is inlined at build time.
      - name: Build web (OpenNext / Cloudflare)
        run: npm run cf:build -w @tog/web
        env:
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}

      # Deploy with the repo's own wrangler (v4, reads wrangler.jsonc) rather
      # than the version bundled in cloudflare/wrangler-action.
      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deploy smoke test
        run: node apps/web/scripts/smoke-test.mjs

      - name: Post-deploy API E2E (all flows + access control)
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL || 'john@grace.org' }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD || 'grace2026' }}
          # Wait for THIS build to be the one serving before asserting.
          EXPECT_BUILD: ${{ github.sha }}
        run: node apps/web/scripts/api-e2e.mjs
