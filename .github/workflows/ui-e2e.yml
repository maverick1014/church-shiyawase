name: UI E2E (browser interaction test)

# Drives the deployed site in a real Chromium and asserts each interaction's
# expected outcome (scripts/ui-e2e.mjs).
#
# MANUAL DISPATCH ONLY — it does NOT run automatically any more.
#
# It used to fire after every successful deploy (via `workflow_run`), and that
# is what made it expensive: each run downloads ~300MB of Chromium before it
# asserts anything, on top of a ~3 minute suite, for every single push to main.
# The suite itself is not going away — it is the only thing that checks the app
# through a browser — it just runs where it is free: LOCALLY, before a push, as
# golden rule G0 in CLAUDE.md now requires.
#
# What still runs automatically is the API E2E inside deploy.yml, which is the
# real release gate: no Chromium, no browser, ~2 minutes, and it is what caught
# the register-form length-cap regression.
#
# Dispatch this when you want the browser suite run against the SHARED
# deployment rather than your own machine — after a branch deploy, say, or to
# confirm a fix on the live site. `UI_E2E_EXPECT_BUILD` is deliberately unset:
# a manual run tests whatever is live right now, which is the whole point of
# asking for one.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Target base URL
        required: false
        default: https://tog.tabernacleofgrace-cn.workers.dev

permissions:
  contents: read

jobs:
  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UI_E2E_URL: ${{ github.event.inputs.base_url || 'https://tog.tabernacleofgrace-cn.workers.dev' }}
      UI_E2E_EMAIL: ${{ secrets.SMOKE_EMAIL || 'john@grace.org' }}
      # Falls back to the bootstrap test account (same as deploy.yml's api-e2e)
      # when the SMOKE_PASSWORD secret isn't set — otherwise the script aborts
      # with "UI_E2E_PASSWORD is required" and the whole workflow shows red.
      UI_E2E_PASSWORD: ${{ secrets.SMOKE_PASSWORD || 'grace2026' }}
    steps:
      # No `ref:` — a dispatch checks out the ref it was made against, which is
      # the version of the script you asked to run.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build shared types
        run: npm run build -w @tog/shared
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run UI E2E
        working-directory: apps/web
        run: npm run test:ui-e2e
