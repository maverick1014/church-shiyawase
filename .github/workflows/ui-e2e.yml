name: UI E2E (browser interaction test)

# Drives the deployed site in a real Chromium and asserts each interaction's
# expected outcome (scripts/ui-e2e.mjs). Runs automatically after each
# successful deploy (via workflow_run) and on manual dispatch — but NOT as a
# deploy gate, so a browser hiccup never blocks a release. The always-on
# coverage is the API E2E inside deploy.yml. Every write it performs (one
# throwaway member) is deleted again, with an API fallback, so the target stays
# clean.
#
# THE SCRIPT MUST COME FROM THE COMMIT THAT WAS DEPLOYED. A workflow_run job
# checks out the default branch by default, but deploy.yml only ever runs on
# feature branches — so main's script would be pointed at a branch's build and
# fail on every UI change that hadn't landed yet. That is what turned this
# workflow into a permanent red-email generator: every automatic run failed
# while every manual dispatch passed. Pin the checkout to the deployed SHA and
# make the script confirm that SHA is actually live before it asserts anything.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Target base URL
        required: false
        default: https://tog.tabernacleofgrace-cn.workers.dev
  # Run automatically after each deployment finishes (decoupled from the deploy
  # job, so a browser hiccup here never blocks a release).
  workflow_run:
    workflows: ['Deploy web to Cloudflare Workers']
    types: [completed]

permissions:
  contents: read

jobs:
  ui-e2e:
    runs-on: ubuntu-latest
    # Only after a successful deploy (or when triggered manually).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 20
    env:
      UI_E2E_URL: ${{ github.event.inputs.base_url || 'https://tog.tabernacleofgrace-cn.workers.dev' }}
      UI_E2E_EMAIL: ${{ secrets.SMOKE_EMAIL || 'john@grace.org' }}
      # Falls back to the bootstrap test account (same as deploy.yml's api-e2e)
      # when the SMOKE_PASSWORD secret isn't set — otherwise the script aborts
      # with "UI_E2E_PASSWORD is required" and the whole workflow shows red.
      UI_E2E_PASSWORD: ${{ secrets.SMOKE_PASSWORD || 'grace2026' }}
      UI_E2E_SHOTS: ${{ github.workspace }}/ui-shots
      # Which build this run is allowed to test. Empty on a manual dispatch
      # (test whatever is live); on workflow_run it is the deployed commit.
      UI_E2E_EXPECT_BUILD: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty on workflow_dispatch → checkout falls back to the ref the
          # dispatch was made against, which is the behaviour we want there.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build shared types
        run: npm run build -w @tog/shared
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run UI E2E
        working-directory: apps/web
        run: mkdir -p "$UI_E2E_SHOTS" && npm run test:ui-e2e
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-screenshots
          path: ui-shots
          retention-days: 14
